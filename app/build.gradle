plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'C:/OpenCV/4.11.0/opencv/build/java', include: '*.jar')
    implementation 'org.jline:jline-terminal:3.21.0'
    implementation 'org.openpnp:opencv:4.5.1-2'

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Guava
    implementation 'com.google.guava:guava:32.1.3-jre'
}

run {
    systemProperty "java.library.path", "C:/OpenCV/4.11.0/opencv/build/java/x64"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'asciivid.App'
}
task gen(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'asciivid.GenAscii'
    // jvmArgs = [
    //     '-Xmx4g',
    //     '-Xms2g',
    //     '-XX:+UseG1GC',
    //     '-XX:MaxMetaspaceSize=1g'
    // ]
}
task buffer(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'asciivid.textExport'
}
task testrun(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'asciivid.test'
}
tasks.named('test') {
    useJUnitPlatform()
}